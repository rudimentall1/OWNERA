[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ownera"
version = "0.1.0"
description = "Autonomous Personal Treasury for Humans and AI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "rudimentall1" }
]
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
ignore = ["FURB157", "UP017"]

[tool.setuptools.packages.find]
include = ["ownera*"]
